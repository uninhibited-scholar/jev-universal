name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --project jev-universal --locked --no-editable --python ${{ matrix.python }}
      - run: uv run --project jev-universal --no-editable ruff check --config jev-universal/pyproject.toml jev-universal/src jev-universal/tests
      - run: uv run --project jev-universal --no-editable ruff format --check --config jev-universal/pyproject.toml jev-universal/src jev-universal/tests
      - run: uv run --project jev-universal --no-editable python -m pytest jev-universal/tests -q
      - run: uv build --project jev-universal --out-dir dist
      - run: uv run --project jev-universal --no-editable jev-universal probe
