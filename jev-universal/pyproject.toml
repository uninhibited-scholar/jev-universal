[project]
name = "jev-universal"
version = "0.2.0"
description = "Jev decision tools for MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "pyjwt[crypto]>=2.10,<3", "python-dotenv>=1.1,<2"]
[project.scripts]
jev-universal = "jev_universal.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]
[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/uninhibited-scholar/jev-universal"
Issues = "https://github.com/uninhibited-scholar/jev-universal/issues"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
